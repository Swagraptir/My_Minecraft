name: Build mod jar

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '-My_Minecraft-/my-minecraft-upload/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '-My_Minecraft-/my-minecraft-upload/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: -My_Minecraft-/my-minecraft-upload

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset generator dependency
        run: python -m pip install Pillow

      - name: Generate mod assets
        run: python tools/generate.py

      - name: Build mod jar
        run: gradle build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-minecraft-jar
          path: |
            -My_Minecraft-/my-minecraft-upload/build/libs/*.jar
            !-My_Minecraft-/my-minecraft-upload/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
