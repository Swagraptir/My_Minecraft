plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"myminecraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Keep generated Java, data, and textures in sync with the Python source-of-truth on every build.
tasks.register('generateModAssets', Exec) {
	workingDir projectDir
	commandLine 'python3', 'tools/generate.py'
}

tasks.register('patchGeneratedSources', Exec) {
	dependsOn tasks.named('generateModAssets')
	workingDir projectDir
	commandLine 'python3', 'tools/patch_generated.py'
}

processResources {
	dependsOn tasks.named('patchGeneratedSources')
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	dependsOn tasks.named('patchGeneratedSources')
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
